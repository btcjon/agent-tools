[project]
name = "jev-skill-advisor"
version = "0.1.0"
description = "Harness-neutral Jev advisory skill selection"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7"]

[project.optional-dependencies]
mcp = ["mcp>=2.0,<3"]

[project.scripts]
skill-advisor-service = "jev_skill_advisor.service_cli:main"
skill-advisor-mcp = "jev_skill_advisor.mcp_server:main"
skill-advisor-admin = "jev_skill_advisor.admin_cli:main"
skill-advisor-catalog = "jev_skill_advisor.catalog_cli:main"
skill-library = "jev_skill_advisor.library_cli:main"
skill-library-publish = "jev_skill_advisor.publish_cli:main"
skill-advisor-shadow = "jev_skill_advisor.shadow_eval:main"
skill-advisor-production = "jev_skill_advisor.production_cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
